spatial:
  country: "BO"
  regions: ["BO-L", "BO-C", "BO-S"]
  granularity: "point"

temporal:
  start: "2020-01-01T00:00:00Z"
  end: "2026-06-30T23:59:59Z"
  frequency: "irregular"
  timezone: "America/La_Paz"

quality:
  status: "verified"
  completeness: 0.98

resources:
  - name: Compilación de datos de calidad del aire de Bolivia
    type: table
    path: https://www.kaggle.com/datasets/sociest/calidad-aire-monica/air_quality_consolidated.csv
    scheme: file
    format: csv
    mediatype: text/csv
    encoding: utf-8
    schema:
      fields:
        - name: fecha_hora_registro
          type: datetime
          description: Fecha y hora del registro
        - name: lugar_nombre
          type: string
          description: Nombre del lugar
          concept: "concepts/air_quality_index.md"
        - name: latitude
          type: number
          description: Latitud del lugar
        - name: longitude
          type: number
          description: Longitud del lugar
        - name: valor_ica
          type: number
          description: Valor del Índice de Calidad del Aire (ICA)
        - name: observaciones
          type: string
          description: Observaciones adicionales
        - name: fuente
          type: string
          description: Fuente de los datos
